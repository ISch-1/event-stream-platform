global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: event-stream-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: event-stream-platform
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
